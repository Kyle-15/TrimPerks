# Builds TrimPerks and checks the tool-trim item models with the game's own parser, on each push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check models
        run: ./gradlew build checkAssets --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: trimperks-jar
          path: build/libs/*.jar
