# Builds TrimPerks for every supported Minecraft version and checks the tool-trim item models with each version's own
# parser, on each push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One jar per version family; 1.21.10's also covers 1.21.9, and 26.1's covers 26.1.1 and 26.1.2
        mc: ["1.21.10", "1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check models
        run: ./gradlew build checkAssets -Pmc=${{ matrix.mc }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: trimperks-${{ matrix.mc }}
          path: build/libs/*.jar
